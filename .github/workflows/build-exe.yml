name: Build and Release DocBridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docbridge-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Plan version
        id: version
        run: python packaging/release.py plan
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Check source syntax
        run: python -m compileall -q src gui packaging
      - name: Build and verify executables
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: docbridge-win64
          path: |
            dist/docbridge.exe
            dist/md2docx.exe
            dist/docx2md.exe
            dist/docbridge-*-win64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: docbridge-win64
          path: dist
      - name: Publish verified Release
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python packaging/release.py publish --version "$env:RELEASE_VERSION" --sha "$env:GITHUB_SHA" --artifacts dist
