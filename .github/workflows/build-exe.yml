name: Build DocBridge

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docbridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Check source syntax
        run: python -m compileall -q src gui packaging
      - name: Build and verify executables
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: docbridge-win64
          path: |
            dist/docbridge.exe
            dist/md2docx.exe
            dist/docx2md.exe
            dist/docbridge-*-win64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docbridge-win64
          path: dist
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem dist -File).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "DocBridge $tag" --generate-notes
          }
